[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I"]


[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true