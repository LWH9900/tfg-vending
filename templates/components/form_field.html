<div class="form-field {% if field.errors %}field-error{% endif %}">

    <label
        for="{{ field.id_for_label }}"
        class="form-label"
    >
        {{ field.label }}
    </label>

    {{ field }}

    {% if field.help_text %}
        <div class="form-text">
            {{ field.help_text }}
        </div>
    {% endif %}

    {% for error in field.errors %}
        <div class="text-danger small mt-1">
            {{ error }}
        </div>
    {% endfor %}

</div>
