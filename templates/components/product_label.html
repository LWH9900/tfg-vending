{% if product %}
    <div class="product-label">
        <div>
            {{ product.name }}
        </div>

        <small class="text-secondary">
            {{ product.category.name }}
            ·
            {{ product.format_unit }}
        </small>
    </div>
{% else %}
    <div class="product-label product-label--empty text-secondary">
        —
    </div>
{% endif %}
